<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f7f7f7;
}

.contact-section{
max-width:1200px;
margin:auto;
padding:60px 20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.contact-info{
background:#fff;
padding:40px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.contact-info h2{
margin-bottom:25px;
}

.info-box{
margin-bottom:20px;
}

.info-box h4{
margin-bottom:6px;
color:#333;
}

.info-box p{
margin:0;
color:#666;
}

.contact-form{
background:#fff;
padding:40px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.contact-form h2{
margin-bottom:20px;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

.contact-form button{
background:#000;
color:#fff;
padding:12px 25px;
border:none;
border-radius:6px;
cursor:pointer;
}

.contact-form button:hover{
background:#333;
}

.map{
margin-top:50px;
}

.map iframe{
width:100%;
height:400px;
border:0;
}

@media(max-width:768px){
.contact-section{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<!-- HEADER (Keep Your Existing Header Here) -->


<!-- HERO IMAGE (Keep Your Existing Hero Banner Here) -->


<section class="contact-section">

<div class="contact-info">

<h2>Contact Information</h2>

<div class="info-box">
<h4>Registered Address</h4>
<p>123 Business Tower, Connaught Place<br>New Delhi, India 110001</p>
</div>

<div class="info-box">
<h4>Operating Address</h4>
<p>456 Office Hub, Sector 62<br>Noida, Uttar Pradesh 201309</p>
</div>

<div class="info-box">
<h4>WhatsApp</h4>
<p><a href="https://wa.me/919999999999">+91 99999 99999</a></p>
</div>

<div class="info-box">
<h4>Call</h4>
<p><a href="tel:+919999999999">+91 99999 99999</a></p>
</div>

<div class="info-box">
<h4>Email</h4>
<p><a href="mailto:info@yourwebsite.com">info@yourwebsite.com</a></p>
</div>

</div>


<div class="contact-form">

<h2>Send Us a Message</h2>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="tel" placeholder="Phone Number">

<textarea rows="5" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</section>


<div class="map">

<iframe src="https://maps.google.com/maps?q=New%20Delhi&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</div>


<!-- FOOTER (Keep Your Existing Footer Here) -->

</body>
</html>
